name: field.blocks.image.name
icon: image
label: "{{ alt }}"
wysiwyg: true
preview: fields
fields:
  image:
    label: field.blocks.image.name
    type: filepicker
    query: model.images
    multiple: false
    layout: cards
    size: large
    image:
      back: black
      ratio: 16/10
    width: 1/2
  ratio:
    extends: fields/ratio
    width: 1/2
  alt:
    extends: fields/alt
    width: 1/2
  caption:
    extends: fields/writer-inline
    label: field.blocks.image.caption
    icon: text
    width: 1/2
