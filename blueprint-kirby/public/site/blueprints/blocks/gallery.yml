name: field.blocks.gallery.name
icon: dashboard
wysiwyg: true
preview: fields
fields:
  images:
    type: structure
    fields:
      image:
        label: field.blocks.image.name
        type: files
        query: model.images
        multiple: false
        layout: cards
        size: small
        image:
          ratio: 3/2
      alt:
        extends: fields/alt
      caption:
        extends: fields/writer-inline
        label: field.blocks.image.caption
        icon: text
  ratio:
    extends: fields/ratio
    width: 1/2
    required: true
    placeholder: false
    default: 3/2
